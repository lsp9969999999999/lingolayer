<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LingoLayer</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <div class="logo">L</div>
    <div class="ttl">
      <div class="t1">LingoLayer</div>
      <div class="t2" id="host">—</div>
    </div>
  </header>

  <div class="card">
    <button id="toggle" class="primary">Translate this page</button>
    <div class="stat" id="stat">Not started</div>
  </div>

  <div class="row">
    <label class="lbl">Auto-translate this site <span class="opt">optional</span></label>
    <label class="switch"><input type="checkbox" id="siteAuto" /><span class="slider"></span></label>
  </div>

  <div class="row">
    <label class="lbl" for="targetLang">Target language</label>
    <select id="targetLang">
      <option>Chinese (Simplified)</option>
      <option>Chinese (Traditional)</option>
      <option>English</option>
      <option>日本語</option>
      <option>한국어</option>
      <option>Spanish</option>
      <option>French</option>
      <option>German</option>
      <option>Portuguese (Brazil)</option>
      <option>Italian</option>
      <option>Russian</option>
      <option>Arabic</option>
      <option>Hindi</option>
      <option>Indonesian</option>
      <option>Thai</option>
      <option>Vietnamese</option>
      <option>Turkish</option>
      <option>Dutch</option>
      <option>Polish</option>
      <option value="__custom__">Custom language (set in Settings)</option>
    </select>
  </div>

  <div class="row">
    <label class="lbl" for="style">Translation style</label>
    <select id="style">
      <option value="dashed">Dashed underline</option>
      <option value="underline">Solid underline</option>
      <option value="highlight">Subtle background</option>
      <option value="quote">Left border</option>
      <option value="plain">Plain text</option>
    </select>
  </div>

  <div class="row">
    <label class="lbl" for="autoMode">Automatic translation</label>
    <select id="autoMode">
      <option value="off">Manual (default)</option>
      <option value="allowlist">Allowlisted sites</option>
      <option value="all">All sites</option>
    </select>
  </div>

  <div class="row"><label class="lbl">Replace original on this site <span class="opt">shopping sites</span></label><label class="switch"><input type="checkbox" id="replaceOriginal" /><span class="slider"></span></label></div>
  <div id="warn" class="warn hidden">No API key yet. <a href="#" id="toOptions2">Set it up</a></div>

  <footer>
    <span class="links">
      <a href="#" id="toDemo">Demo</a>
      <a href="#" id="toOptions">Settings</a>
    </span>
    <span class="tip">Alt+T page · Alt+S selection</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
