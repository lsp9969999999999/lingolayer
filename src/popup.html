<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LingoLayer</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <div class="logo">L</div>
    <div class="ttl">
      <div class="t1">LingoLayer</div>
      <div class="t2" id="host">—</div>
    </div>
  </header>

  <div class="card">
    <button id="toggle" class="primary">翻译此页面</button>
    <div class="stat" id="stat">未开始</div>
  </div>

  <div class="row">
    <label class="lbl">本站自动翻译 <span class="opt">可选</span></label>
    <label class="switch"><input type="checkbox" id="siteAuto" /><span class="slider"></span></label>
  </div>

  <div class="row">
    <label class="lbl" for="targetLang">目标语言</label>
    <select id="targetLang">
      <option>中文（简体）</option>
      <option>中文（繁體）</option>
      <option>English</option>
      <option>日本語</option>
      <option>한국어</option>
    </select>
  </div>

  <div class="row">
    <label class="lbl" for="style">译文样式</label>
    <select id="style">
      <option value="dashed">下划虚线</option>
      <option value="underline">下划实线</option>
      <option value="highlight">浅色背景</option>
      <option value="quote">左侧竖线</option>
      <option value="plain">无装饰</option>
    </select>
  </div>

  <div class="row">
    <label class="lbl" for="autoMode">自动模式</label>
    <select id="autoMode">
      <option value="off">手动启用（默认）</option>
      <option value="allowlist">仅白名单自动</option>
      <option value="all">全部网站自动</option>
    </select>
  </div>

  <div id="warn" class="warn hidden">尚未设置 API Key，<a href="#" id="toOptions2">立即设置</a></div>

  <footer>
    <span class="links">
      <a href="#" id="toDemo">操作演示</a>
      <a href="#" id="toOptions">高级设置</a>
    </span>
    <span class="tip">Alt+T 整页 · Alt+S 选中</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
