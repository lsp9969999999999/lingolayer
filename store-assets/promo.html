*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef1f8;color:#15203b}body{min-width:900px}.tile{height:560px;position:relative;overflow:hidden;background:linear-gradient(120deg,#4568f5 0%,#5d57ed 48%,#884ce8 100%);padding:62px 78px;color:white}.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18}.o1{width:420px;height:420px;right:-80px;top:-190px;background:#c4d4ff}.o2{width:300px;height:300px;left:40%;bottom:-230px;background:#c88bff}.copy{position:relative;z-index:2;width:49%}.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:-.5px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:white;color:#5265f5;font-size:25px;box-shadow:0 8px 24px #202b8740}.headline{font-size:48px;line-height:1.08;margin:44px 0 18px;letter-spacing:-1.5px}.sub{font-size:22px;line-height:1.45;max-width:510px;color:#eef1ff}.pills{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}.pill{padding:9px 14px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff40;font-size:14px}.browser{position:absolute;z-index:2;right:60px;top:76px;width:51%;height:406px;border-radius:18px;background:#fff;box-shadow:0 22px 60px #1d2d8245;overflow:hidden;color:#25304a}.bar{height:42px;background:#f4f6fb;border-bottom:1px solid #e5e8f1;display:flex;align-items:center;padding:0 16px;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#d0d5e4}.address{margin-left:12px;height:22px;border-radius:8px;background:#e9edf6;flex:1}.page{padding:26px 30px}.line{height:10px;border-radius:5px;background:#dfe5f3;margin:0 0 13px}.line.w1{width:76%}.line.w2{width:93%}.line.w3{width:68%}.line.title{height:18px;width:54%;background:#283552;margin-bottom:22px}.translation{height:34px;border-left:4px solid #6475f6;background:#eef1ff;border-radius:0 8px 8px 0;margin:8px 0 22px;padding:9px 13px;color:#5363b8;font-size:13px}.note{position:absolute;right:28px;bottom:24px;font-size:13px;color:#ffffffaa}
